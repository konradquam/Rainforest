[project]
name = "rainforest"
version = "0.1.0"
description = "Agentic ecosystem built on Temporal workflows"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.31.0",
    "anthropic>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
